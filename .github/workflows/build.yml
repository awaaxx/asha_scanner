name: Build and Sign Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Create Keystore and Sign APK
        run: |
          # ساخت یک کلید اختصاصی پایدار
          keytool -genkeypair -v \
            -keystore my-release-key.jks \
            -alias "asha-key" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "AshaSecurePass123" \
            -keypass "AshaSecurePass123" \
            -dname "CN=AshaScanner, OU=Security, O=Asha, L=Tehran, ST=Tehran, C=IR"
          
          # پیدا کردن جدیدترین apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          # پیدا کردن فایل خروجی خام
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # امضای APK
          $APKSIGNER sign --ks my-release-key.jks \
            --ks-key-alias "asha-key" \
            --ks-pass "pass:AshaSecurePass123" \
            --key-pass "pass:AshaSecurePass123" \
            --out app/build/outputs/apk/release/asha-scanner-signed.apk \
            "$APK_PATH"
            
          # بررسی صحت امضا
          $APKSIGNER verify app/build/outputs/apk/release/asha-scanner-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: asha-scanner-signed
          path: app/build/outputs/apk/release/asha-scanner-signed.apk
