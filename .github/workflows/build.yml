name: Build and Sign Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK
        uses: ralfir/android-release-signer@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.MY_KEYSTORE_BASE64 }}
          alias: ${{ secrets.my-key-alias }}
          keyStorePassword: ${{ secrets.MY_KEY_PASSWORD }}
          keyPassword: ${{ secrets.MY_KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: asha-scanner-signed
          path: app/build/outputs/apk/release/*-signed.apk
